name: Generate Bomberman Contribution Graph

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Bomberman Animation
        uses: abozanona/pacman-contribution-graph@main # Or use the specific action configuration provided in the repo instructions
        with:
          github_user_name: xKurty06
          # Output file paths
          output: dist/bomberman.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

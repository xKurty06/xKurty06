name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake
        uses: Platane/snk@master
        with:
          github_user_name: xKurty06
          outputs: dist/snake.svg
          color_snake: "#05cbf7" # Neon blue snake
          color_dots: "#0a0a0a #1a1a1a #222222 #444444 #05cbf7" # Dark background & neon accent
      - name: Upload Snake
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
